services:
  postgres:
    image: postgres:16-alpine
    container_name: iproofnow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: iproof
      POSTGRES_PASSWORD: proof123
      POSTGRES_DB: iproofnow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iproof -d iproofnow"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: iproofnow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: iproof
      MINIO_ROOT_PASSWORD: proof123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: iproofnow-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 iproof proof123;
      mc mb --ignore-existing local/iproofnow-files;
      mc anonymous set none local/iproofnow-files;
      echo '✓ MinIO bucket iproofnow-files ready';
      "
    restart: "no"

volumes:
  postgres-data:
  minio-data:
